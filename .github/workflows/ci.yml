name: CI

# 设计说明
# --------
# 1. **冒烟拆成独立 step**：此前 11 个脚本塞在一个 step 里，失败时只知道
#    "某条命令退出码非 0"，定位不到是哪个脚本。拆开后哪一步红就是哪个脚本红。
# 2. **只放"纯逻辑 + 零外部资源"的脚本进 CI**：CI 是 Linux 容器，没有本地教材
#    PDF、没有历史运行数据。依赖这些的脚本留在本地跑（AGENTS.md 有完整清单），
#    CI 只守"改了 A 不会悄悄坏掉 B"这条底线。
# 3. **Docker job 保留**：README 承诺了容器部署，而作者本机没有 Docker，
#    只能靠 CI 真实构建兑现这个承诺（首次已验证通过，约 12 分钟）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: 离线冒烟（零模型额度）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖
        working-directory: backend
        run: uv sync

      - name: 接口契约（前端路径 vs 后端路由）
        env: { PYTHONPATH: backend }
        run: uv run --project backend python scripts/smoke_api_contract.py

      - name: OpenAPI 文档可生成
        env: { PYTHONPATH: backend }
        run: uv run --project backend python scripts/smoke_openapi.py

      - name: LLM 服务降级（不静默切演示模板）
        env: { PYTHONPATH: backend }
        run: uv run --project backend python scripts/smoke_llm_service.py

      - name: 课件契约与校验（12 种功能页 + 闭环 + 5 维量规）
        env: { PYTHONPATH: backend }
        run: uv run --project backend python scripts/smoke_lesson_deck.py

      - name: 课件生成器（校验不通过要打回重做）
        env: { PYTHONPATH: backend }
        run: uv run --project backend python scripts/smoke_deck_generator.py

      - name: 成品文本渲染（repr 泄漏闸门）
        env: { PYTHONPATH: backend }
        run: uv run --project backend python scripts/smoke_text_render.py

      - name: 前端纯逻辑（学科守卫）
        run: node scripts/smoke_subject_guard.mjs

      - name: 前端纯逻辑（对话动作路由）
        run: node scripts/smoke_chat_action.mjs

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t eduforge:ci .

      - name: 启动容器并验证健康接口
        run: |
          docker run -d --name ef -p 8005:8005 \
            -e HOST=0.0.0.0 -e PORT=8005 \
            eduforge:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8005/api/health || true)
            if [ "$code" = "200" ]; then echo "健康检查通过（${i}s）"; exit 0; fi
            sleep 1
          done
          echo "健康检查失败"; docker logs ef | tail -40; exit 1

      - name: 清理
        if: always()
        run: docker rm -f ef || true
